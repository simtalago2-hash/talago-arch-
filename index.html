<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#af3129">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talago Arch">
<meta name="description" content="Talago Arch: a personal drafting sketchbook.">
<title>Talago Arch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Reusable icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3M5 18.5A1.5 1.5 0 0 1 6.5 17H18"/></symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 3 4.5v14c5 0 7.5.5 9 2 1.5-1.5 4-2 9-2v-14c-5 0-7.5.5-9 2zM12 6.5v14"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M10 4l1.6 4.4L16 10l-4.4 1.6L10 16l-1.6-4.4L4 10l4.4-1.6zM18 3v4M16 5h4M7 18a1.5 1.5 0 1 0 0 .01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 21h12M5.5 16.5l9.6-9.6a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L11 19H8z"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </defs>
</svg>

<main id="app">
  <!-- Table of contents (diary-page style) -->
  <section id="view-toc" class="view page" hidden>
    <div class="page-inner">
      <header class="diary-head">
        <h1 class="diary-title">Table of Contents</h1>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="toc-ai" aria-label="ChatGPT and backups"><svg><use href="#i-spark"/></svg></button>
          <button type="button" class="icon-btn" id="toc-close" aria-label="Close notebook"><svg><use href="#i-book"/></svg></button>
        </div>
      </header>
      <ol id="project-list" class="diary"></ol>
      <footer class="diary-foot"><span>Talago Arch</span><span id="toc-count"></span></footer>
    </div>
  </section>

  <!-- Project -->
  <section id="view-project" class="view page" hidden>
    <div class="page-inner">
      <header class="diary-head">
        <button type="button" class="crumb" id="proj-back"><svg><use href="#i-back"/></svg> Contents</button>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="proj-menu" aria-label="Project options"><svg><use href="#i-more"/></svg></button>
        </div>
      </header>
      <div class="dots"></div>
      <div class="proj-head">
        <span class="e-num" id="proj-num"></span>
        <div><h1 class="e-name" id="proj-title"></h1><div class="e-meta" id="proj-lede"></div></div>
      </div>
      <div class="dots"></div>
      <button id="add-sketch" class="e-add" type="button"><span class="e-num">+</span><span class="e-name">New sketch</span></button>
      <div class="dots"></div>
      <div id="sketch-grid" class="sketch-grid"></div>
      <div class="dots end"></div>
      <footer class="diary-foot"><span>Talago Arch</span><span id="proj-count"></span></footer>
    </div>
  </section>

  <!-- Sketch: full screen, no border -->
  <section id="view-sketch" class="view" hidden>
    <canvas id="canvas" aria-label="Drawing canvas"></canvas>

    <div class="sk-top">
      <div class="sk-group">
        <button type="button" class="tb" id="sk-back" aria-label="Back to project"><svg><use href="#i-back"/></svg></button>
        <button type="button" class="tb" data-act="undo" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
        <button type="button" class="tb" data-act="redo" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
        <span class="sep"></span>
        <button type="button" class="tb" data-act="clear" aria-label="Clear sketch"><svg><use href="#i-trash"/></svg></button>
      </div>
      <div class="sk-name" id="sk-title"></div>
      <div class="sk-group">
        <button type="button" class="tb" id="sk-share" aria-label="Share sketch"><svg><use href="#i-share"/></svg></button>
        <button type="button" class="tb" id="sk-menu" aria-label="More options"><svg><use href="#i-more"/></svg></button>
      </div>
    </div>

    <nav class="toolbar" id="toolbar">
      <button type="button" class="tool" data-tool="line" aria-label="Straight line (L)"><svg><use href="#i-line"/></svg></button>
      <button type="button" class="tool" data-tool="pencil" aria-label="Pencil (P)"><svg><use href="#i-pencil"/></svg></button>
      <button type="button" class="tool" data-tool="erase" aria-label="Eraser (E)"><svg><use href="#i-eraser"/></svg></button>
      <button type="button" class="tool" data-tool="hand" aria-label="Pan (H)"><svg><use href="#i-hand"/></svg></button>
      <span class="sep"></span>
      <button type="button" class="swatch-btn" data-act="pen" aria-label="Ink and weight"><span class="swatch" id="pen-swatch"></span><svg class="caret"><use href="#i-down"/></svg></button>
      <button type="button" class="txt" data-act="ortho" aria-label="Ortho mode (O)">Ortho</button>
      <button type="button" class="txt" data-act="grid" aria-label="Grid spacing"><span id="grid-label">1'</span></button>
    </nav>

    <div class="sk-bottom">
      <div class="zoom">
        <button type="button" class="tb" data-act="zoom-out" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
        <button type="button" class="zoom-val" data-act="fit" id="zoom-val" aria-label="Fit drawing">100%</button>
        <button type="button" class="tb" data-act="zoom-in" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
        <button type="button" class="tb" data-act="fullscreen" id="fs-btn" aria-label="Full screen"><svg><use href="#i-expand"/></svg></button>
      </div>
      <div class="status" id="save-status">Saved to notebook</div>
    </div>
  </section>
</main>

<!-- Red notebook cover (flips open on launch) -->
<div id="cover" class="cover" role="button" aria-label="Open notebook">
  <div class="cover-leaf">
    <div class="cover-face">
      <div class="cover-mark">
        <div class="cover-mono">Ta</div>
        <div class="cover-title">Talago Arch</div>
        <div class="cover-sub">Personal sketchbook</div>
      </div>
      <div class="cover-open">Open notebook <svg><use href="#i-book-open"/></svg></div>
    </div>
    <div class="cover-back"></div>
  </div>
  <div class="cover-band"></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
