<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#a3222a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talago Arch">
<meta name="description" content="Talago Arch: a personal drafting sketchbook.">
<title>Talago Arch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/CormorantGaramond.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ArchitectsDaughter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">
  <!-- Table of contents -->
  <section id="view-toc" class="view page" hidden>
    <div class="page-inner">
      <header class="page-head">
        <div class="kicker">Talago Arch</div>
        <h1>Contents</h1>
      </header>
      <ol id="project-list" class="toc"></ol>
      <button id="add-project" class="add-line" type="button"><span class="plus">+</span> New project</button>
      <footer class="page-foot">
        <button id="install-btn" class="link" type="button" hidden>Install app</button>
        <button id="export-btn" class="link" type="button">Back up notebook</button>
        <label class="link">Restore backup<input type="file" id="import-input" accept="application/json,.json" hidden></label>
        <p id="install-tip" class="tip" hidden></p>
      </footer>
    </div>
  </section>

  <!-- Project -->
  <section id="view-project" class="view page" hidden>
    <div class="page-inner">
      <header class="page-head row">
        <button class="back" id="proj-back" type="button">‹ Contents</button>
        <button class="icon-btn" id="proj-menu" type="button" aria-label="Project options">⋯</button>
      </header>
      <div class="kicker" id="proj-kicker"></div>
      <h1 id="proj-title"></h1>
      <div id="sketch-grid" class="sketch-grid"></div>
    </div>
  </section>

  <!-- Sketch -->
  <section id="view-sketch" class="view" hidden>
    <canvas id="canvas" aria-label="Drawing canvas"></canvas>
    <div class="hud-top">
      <button id="sk-back" class="chip" type="button">‹ <span id="sk-proj"></span></button>
      <div id="sk-title" class="sk-title"></div>
      <button id="sk-share" class="chip icon" type="button" aria-label="Share sketch">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      </button>
      <button id="sk-menu" class="chip icon" type="button" aria-label="More options">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
    </div>
    <div id="scale-chip" class="scale-chip"></div>
    <nav class="toolbar" id="toolbar">
      <button type="button" data-act="ortho" title="Ortho (O)">
        <svg viewBox="0 0 24 24"><path d="M4 20h16M4 20V4M4 20L18 6"/></svg><span>Ortho</span></button>
      <button type="button" data-act="snap" title="Snap to grid (G)">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="2.6"/><circle cx="18" cy="12" r="1.3"/><circle cx="6" cy="18" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="18" cy="18" r="1.3"/></svg><span>Snap</span></button>
      <button type="button" data-act="dims" title="Show dimensions (D)">
        <svg viewBox="0 0 24 24"><path d="M3 15h18M3 11v8M21 11v8M8 9h8"/></svg><span>Dims</span></button>
      <button type="button" data-act="erase" title="Eraser (E)">
        <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6l-3-3z M9 10l5 5 M10 18h10"/></svg><span>Erase</span></button>
      <button type="button" data-act="pen" title="Line weight (W)">
        <svg viewBox="0 0 24 24"><path id="pen-ico" d="M4 12h16"/></svg><span id="pen-label">Pen</span></button>
      <button type="button" data-act="grid" title="Grid spacing">
        <svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg><span id="grid-label">1'</span></button>
      <button type="button" data-act="undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg><span>Undo</span></button>
      <button type="button" data-act="redo" title="Redo (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h2"/></svg><span>Redo</span></button>
    </nav>
  </section>
</main>

<!-- Red notebook cover (flips open on launch) -->
<div id="cover" class="cover" role="button" aria-label="Open notebook">
  <div class="cover-leaf">
    <div class="cover-face">
      <div class="cover-emboss">
        <div class="cover-mono">Ta</div>
        <div class="cover-title">Talago Arch</div>
        <div class="cover-rule"></div>
        <div class="cover-sub">Sketchbook</div>
      </div>
      <div class="cover-hint">tap to open</div>
    </div>
    <div class="cover-back"></div>
  </div>
  <div class="cover-band"></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
